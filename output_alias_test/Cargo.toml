
[package]
name = "output_alias_test"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true }
thruput-xdr = { workspace = true, features = ["xdrs", "syscalls"] }
thruput-syscall = { workspace = true }

[lib]
crate-type = ["rlib"]
doctest = false

[features]
entrypoints = []
dev = ["sdk/dev", "std"]
std = ["sdk/std"]
logging = ["sdk/logging"]

[dev-dependencies]
output_alias_test = { path = ".", features = ["dev"] }

[[bin]]
name = "output_alias_test"
path = "src/main.rs"
required-features = ["entrypoints"]
