[package]
name = "ed25519_verify_wrapper"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
thruput-sdk = { workspace = true, features = ["alloc"] }

[lib]
crate-type = ["rlib"]
doctest = false

[features]
entrypoints = []
dev = ["thruput-sdk/dev", "std"]
std = ["thruput-sdk/std"]

[dev-dependencies]
ed25519_verify_wrapper = { path = ".", features = ["dev"] }
ed25519-dalek = { version = "3", features = ["rand_core"] }
getrandom = { version = "0.4", features = ["sys_rng"] }

[[bin]]
name = "ed25519_verify_wrapper"
path = "src/main.rs"
required-features = ["entrypoints"]
