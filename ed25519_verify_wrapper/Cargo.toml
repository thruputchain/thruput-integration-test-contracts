#cargo-features = ["trim-paths", "profile-rustflags"] #unstable

[package]
name = "ed25519_verify_wrapper"
version.workspace = true
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["alloc"] }

[lib]
crate-type = ["rlib"]
doctest = false

[features]
entrypoints = []
dev = ["sdk/dev", "std"]
std = ["sdk/std"]

[dev-dependencies]
ed25519_verify_wrapper = { path = ".", features = ["dev"] }
ed25519-dalek = { version = "3", features = ["rand_core"] }
getrandom = { version = "0.4", features = ["sys_rng"] }

[[bin]]
name = "ed25519_verify_wrapper"
path = "src/main.rs"
required-features = ["entrypoints"]
