#cargo-features = ["trim-paths", "profile-rustflags"] #unstable

[package]
name = "ed25519_verify_wrapper"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["alloc"] }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[[bin]]
name = "generate_spec_ed25519_verify_wrapper"
path = "src/bin/generate_spec.rs"
required-features = ["spec"]

[features]
client = []
dev = ["sdk/dev", "std"]
spec = ["sdk/spec", "std"]
std = ["sdk/std"]

[dev-dependencies]
ed25519_verify_wrapper = { path = ".", features = ["dev"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
