[package]
name = "authclaim_test"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true }

[[bin]]
name = "generate_spec_authclaim_test"
path = "src/bin/generate_spec.rs"
required-features = ["spec"]

[lib]
crate-type = ["cdylib", "rlib"]
test = false
doctest = false

[features]
std = []
dev = ["sdk/dev", "std"]
spec = ["std", "sdk/spec"]
logging = ["sdk/logging"]

[dev-dependencies]
authclaim_test = { path = ".", features = ["dev"] }
