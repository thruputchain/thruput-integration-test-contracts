[package]
name = "authclaim_test"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
thruput-sdk = { workspace = true }

[lib]
crate-type = ["rlib"]
test = false
doctest = false

[features]
entrypoints = []
std = []
dev = ["thruput-sdk/dev", "std"]
logging = ["thruput-sdk/logging"]

[dev-dependencies]
authclaim_test = { path = ".", features = ["dev"] }

[[bin]]
name = "authclaim_test"
path = "src/main.rs"
required-features = ["entrypoints"]
