[package]
name = "authclaim_test"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["storage"] }

[lib]
crate-type = ["cdylib", "rlib"]
test = false
doctest = false

[features]
entrypoints = []
std = []
dev = ["sdk/dev", "std"]
logging = ["sdk/logging"]

[dev-dependencies]
authclaim_test = { path = ".", features = ["dev"] }

[[bin]]
name = "authclaim_test"
path = "src/main.rs"
required-features = ["entrypoints"]
