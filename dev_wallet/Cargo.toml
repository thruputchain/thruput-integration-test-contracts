[package]
name = "dev_wallet"
version = "0.1.0"
edition = "2021"

[dependencies]
thruput-sdk = { workspace = true }
thruput-erc20-if = { workspace = true }

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[features]
entrypoints = []
dev = ["thruput-sdk/dev", "thruput-sdk/std"]
std = ["thruput-sdk/std"]
logging = ["thruput-sdk/logging"]

[dev-dependencies]
dev_wallet = { path = ".", features = ["dev"] }

[[bin]]
name = "dev_wallet"
path = "src/main.rs"
required-features = ["entrypoints"]
