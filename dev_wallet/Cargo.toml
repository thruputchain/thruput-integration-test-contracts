[package]
name = "dev_wallet"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true }
groundhog-erc20-if = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[features]
entrypoints = []
dev = ["sdk/dev", "sdk/std"]
std = ["sdk/std"]
logging = ["sdk/logging"]

[dev-dependencies]
dev_wallet = { path = ".", features = ["dev", "entrypoints"] }
