[package]
name = "dev_wallet"
version.workspace = true
edition = "2021"

[dependencies]
sdk = { workspace = true }
groundhog-erc20-if = { workspace = true }

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[features]
entrypoints = []
dev = ["sdk/dev", "sdk/std"]
std = ["sdk/std"]
logging = ["sdk/logging"]

[dev-dependencies]
dev_wallet = { path = ".", features = ["dev"] }

[[bin]]
name = "dev_wallet"
path = "src/main.rs"
required-features = ["entrypoints"]
