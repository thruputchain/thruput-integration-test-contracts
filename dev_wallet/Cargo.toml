[package]
name = "dev_wallet"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true }
groundhog-erc20-if = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[[bin]]
name = "generate_spec_dev_wallet"
path = "src/bin/generate_spec.rs"
required-features = ["spec"]

[features]
entrypoints = []
dev = ["sdk/dev", "sdk/std"]
spec = ["sdk/spec", "std"]
std = ["sdk/std"]
logging = ["sdk/logging"]

[dev-dependencies]
dev_wallet = { path = ".", features = ["dev", "entrypoints"] }
