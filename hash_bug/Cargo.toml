
[package]
name = "hash_bug"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
sha2.workspace = true
hex-literal = { version = "1.1.0" }

[target.'cfg(target_arch = "riscv32")'.dependencies]
thruput-sdk = { workspace = true }

[lib]
crate-type = ["rlib"]
doctest = false

[[bin]]
name = "hash_bug"
path = "src/main.rs"
required-features = ["entrypoints"]

[features]
entrypoints = []
default = []
dev = []
guest = []
logging = []
