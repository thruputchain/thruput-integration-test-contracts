
[package]
name = "hash_bug"
version.workspace = true
edition = "2021"

[dependencies]
sha2.workspace = true
hex-literal = { version = "1.1.0" }

[target.'cfg(target_arch = "riscv32")'.dependencies]
sdk = { workspace = true }

[lib]
crate-type = ["rlib"]
doctest = false

[[bin]]
name = "hash_bug"
path = "src/main.rs"
required-features = ["entrypoints"]

[features]
entrypoints = []
default = []
guest = []
logging = []
