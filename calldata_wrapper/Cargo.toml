cargo-features = ["trim-paths", "profile-rustflags"] #unstable

[package]
name = "calldata_wrapper"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
default = ["guest"]
client = []
guest = []
mock = ["guest", "sdk/mock"]

[dev-dependencies]
calldata_wrapper = { path = ".", features = ["mock", "client"] }
