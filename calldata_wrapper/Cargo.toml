#cargo-features = ["trim-paths", "profile-rustflags"] #unstable

[package]
name = "calldata_wrapper"
version.workspace = true
edition.workspace = true

[dependencies]
sdk = { workspace = true, features = ["storage"] }

# Optional
bottle-test-if = { workspace = true, optional = true }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
entrypoints = []
dev = ["sdk/dev"]
bottle-test = ["dep:bottle-test-if"]

[dev-dependencies]
calldata_wrapper = { path = ".", features = ["dev"] }

[[bin]]
name = "calldata_wrapper"
path = "src/main.rs"
