cargo-features = ["trim-paths", "profile-rustflags"] #unstable

[package]
name = "calldata_wrapper"
version.workspace = true
edition.workspace = true

[dependencies]
sdk = { workspace = true, features = ["alloc"] }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
default = ["guest"]
client = []
guest = []
mock = ["guest", "sdk/mock"]

[dev-dependencies]
calldata_wrapper = { path = ".", features = ["mock", "client"] }
