[package]
name = "calldata_wrapper"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
thruput-sdk = { workspace = true, features = ["alloc"] }

[lib]
crate-type = ["rlib"]
doctest = false

[features]
entrypoints = []
dev = ["thruput-sdk/dev"]

[dev-dependencies]
calldata_wrapper = { path = ".", features = ["dev"] }

[[bin]]
name = "calldata_wrapper"
path = "src/main.rs"
required-features = ["entrypoints"]
