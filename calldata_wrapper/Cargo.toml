cargo-features = ["trim-paths", "profile-rustflags"] #unstable

[package]
name = "calldata_wrapper"
version.workspace = true
edition.workspace = true

[dependencies]
sdk = { workspace = true, features = ["storage"] }
xdrs = { workspace = true, features = ["derive"] }

# Optional
bottle-test-if = { workspace = true, optional = true }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
default = ["guest"]
client = []
guest = []
mock = ["guest", "sdk/mock"]
logging = ["sdk/logging"]
bottle-test = ["dep:bottle-test-if", "client"]

[dev-dependencies]
calldata_wrapper = { path = ".", features = ["mock", "client"] }
