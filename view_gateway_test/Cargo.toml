[package]
name = "view_gateway_test"
version = "0.2.0"
edition = "2021"
license.workspace = true
publish = false

[dependencies]
thruput-sdk = { workspace = true, features = ["alloc"] }
thruput-xdr = { workspace = true }

[lib]
crate-type = ["rlib"]
doctest = false

[features]
entrypoints = []
dev = ["thruput-sdk/dev"]
std = ["thruput-sdk/std"]

[[bin]]
name = "view_gateway_test"
path = "src/main.rs"
required-features = ["entrypoints"]
