[package]
name = "view_gateway_test"
version.workspace = true
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["alloc"] }

[lib]
crate-type = ["rlib"]
doctest = false

[features]
entrypoints = []
dev = ["sdk/dev"]
std = ["sdk/std"]

[[bin]]
name = "view_gateway_test"
path = "src/main.rs"
required-features = ["entrypoints"]
