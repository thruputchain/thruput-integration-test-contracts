cargo-features = ["trim-paths", "profile-rustflags"] #unstable

[package]
name = "cxs_roundtrip"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["storage"] }
serde = { workspace = true, features = ["derive"] }
xdrs = { workspace = true, features = ["alloc", "xdr_common"] }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
default = ["guest", "alloc", "xdrs"]
client = []
guest = []
mock = ["guest", "sdk/mock"]
alloc = []
xdrs = []

[dev-dependencies]
cxs_roundtrip = { path = ".", features = ["mock", "client"] }
