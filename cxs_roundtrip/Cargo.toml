#cargo-features = ["trim-paths", "profile-rustflags"] #unstable

[package]
name = "cxs_roundtrip"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["storage"] }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[[bin]]
name = "generate_spec_cxs_roundtrip"
path = "src/bin/generate_spec.rs"
required-features = ["spec"]

[[bin]]
name = "generate_types_cxs_roundtrip"
path = "src/bin/generate_types.rs"
required-features = ["spec"]

[features]
default = ["guest", "alloc", "xdrs"]
entrypoints = []
guest = []
mock = ["guest", "sdk/dev"]
alloc = []
xdrs = []
spec = ["sdk/spec", "std"]
std = ["sdk/std"]
logging = ["sdk/logging"]

[dev-dependencies]
cxs_roundtrip = { path = ".", features = ["mock", "entrypoints"] }
