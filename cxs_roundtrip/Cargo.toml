[package]
name = "cxs_roundtrip"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[dependencies]
thruput-sdk = { workspace = true, features = ["alloc"] }
xdrs = { workspace = true, features = ["derive", "alloc", "int128"] }

[lib]
crate-type = ["rlib"]
doctest = false

[features]
entrypoints = []
std = ["thruput-sdk/std"]
logging = ["thruput-sdk/logging"]
dev = ["thruput-sdk/dev"]

[dev-dependencies]
cxs_roundtrip = { path = ".", features = ["dev"] }

[[bin]]
name = "cxs_roundtrip"
path = "src/main.rs"
required-features = ["entrypoints"]

[package.metadata.gnaw]
kind = "disabled"
