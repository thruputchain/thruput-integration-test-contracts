#cargo-features = ["trim-paths", "profile-rustflags"] #unstable

[package]
name = "cxs_roundtrip"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["alloc"] }
xdrs = { workspace = true, features = ["derive", "alloc", "int128"] }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
entrypoints = []
std = ["sdk/std"]
logging = ["sdk/logging"]
dev = ["sdk/dev"]

[dev-dependencies]
cxs_roundtrip = { path = ".", features = ["dev"] }

[[bin]]
name = "cxs_roundtrip"
path = "src/main.rs"
required-features = ["entrypoints"]
