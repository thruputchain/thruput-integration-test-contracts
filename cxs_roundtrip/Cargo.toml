#cargo-features = ["trim-paths", "profile-rustflags"] #unstable

[package]
name = "cxs_roundtrip"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["storage"] }
xdrs = { workspace = true, features = ["derive", "alloc", "int128"] }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[[bin]]
name = "generate_spec_cxs_roundtrip"
path = "src/bin/generate_spec.rs"
required-features = ["spec"]

[[bin]]
name = "generate_types_cxs_roundtrip"
path = "src/bin/generate_types.rs"
required-features = ["spec"]

[features]
entrypoints = []
spec = ["sdk/spec", "std"]
std = ["sdk/std"]
logging = ["sdk/logging"]
dev = ["sdk/dev"]

[dev-dependencies]
cxs_roundtrip = { path = ".", features = ["dev", "entrypoints"] }
