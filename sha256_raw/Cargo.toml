[package]
name = "sha256_raw"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["alloc"] }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[features]
default = ["guest"]
entrypoints = []
guest = []
mock = ["guest", "sdk/mock"]
logging = ["sdk/logging"]

[dev-dependencies]
sha256_raw = { path = ".", features = ["mock", "entrypoints"] }
