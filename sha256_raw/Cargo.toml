[package]
name = "sha256_raw"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["alloc"] }

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[[bin]]
name = "sha256_raw"
path = "src/main.rs"
required-features = ["entrypoints"]

[features]
default = ["guest"]
entrypoints = []
guest = []
dev = ["guest", "sdk/dev"]
logging = ["sdk/logging"]

[dev-dependencies]
# The one convention for a contract's self dev-dependency: `dev` and
# nothing else. NOT "entrypoints" — that is the rv32 bin's
# `required-features`, so enabling it here makes host `cargo test` try to
# link the `#![no_main]` bin ("undefined symbol: main").
sha256_raw = { path = ".", features = ["dev"] }
