[package]
name = "sha256_raw"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["alloc"] }

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[[bin]]
name = "sha256_raw"
path = "src/main.rs"
required-features = ["entrypoints"]

[features]
default = ["guest"]
entrypoints = []
guest = []
dev = ["sdk/dev"]
mock = ["guest", "sdk/mock"]
logging = ["sdk/logging"]

[dev-dependencies]
sha256_raw = { path = ".", features = ["mock", "entrypoints"] }
