[package]
name = "deploy_and_transfer"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[dependencies]
thruput-sdk = { workspace = true }
thruput-erc20-if = { workspace = true }

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[features]
entrypoints = []
dev = ["thruput-sdk/dev", "thruput-sdk/std"]
std = ["thruput-sdk/std"]
logging = ["thruput-sdk/logging"]
alloc = []

[dev-dependencies]
deploy_and_transfer = { path = ".", features = ["dev"] }

[[bin]]
name = "deploy_and_transfer"
path = "src/main.rs"
required-features = ["entrypoints"]
