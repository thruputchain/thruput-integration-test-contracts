[package]
name = "deploy_and_transfer"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["alloc"] }
groundhog-erc20-if = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[features]
entrypoints = []
dev = ["sdk/dev", "sdk/std"]
std = ["sdk/std"]
logging = ["sdk/logging"]
alloc = []

[dev-dependencies]
deploy_and_transfer = { path = ".", features = ["dev"] }

[[bin]]
name = "deploy_and_transfer"
path = "src/main.rs"
required-features = ["entrypoints"]
