[package]
name = "delegate_call_test"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[dependencies]
thruput-sdk = { workspace = true }

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[features]
default = ["guest"]
entrypoints = []
guest = []
dev = ["guest", "thruput-sdk/dev"]
logging = ["thruput-sdk/logging"]

[dev-dependencies]
delegate_call_test = { path = ".", features = ["dev"] } 

[[bin]]
name = "delegate_call_test"
path = "src/main.rs"
required-features = ["entrypoints"]
