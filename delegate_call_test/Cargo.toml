#cargo-features = ["trim-paths", "profile-rustflags"] #unstable

[package]
name = "delegate_call_test"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["alloc"] }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[features]
default = ["guest"]
entrypoints = []
guest = []
dev = ["guest", "sdk/dev"]
logging = ["sdk/logging"]

[dev-dependencies]
delegate_call_test = { path = ".", features = ["dev"] } 

[[bin]]
name = "delegate_call_test"
path = "src/main.rs"
required-features = ["entrypoints"]
