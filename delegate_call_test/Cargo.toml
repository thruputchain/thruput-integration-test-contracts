cargo-features = ["trim-paths", "profile-rustflags"] #unstable

[package]
name = "delegate_call_test"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["storage"] }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
default = ["guest"]
client = []
guest = []
mock = ["guest", "sdk/mock"]

[dev-dependencies]
delegate_call_test = { path = ".", features = ["mock", "client"] } 
