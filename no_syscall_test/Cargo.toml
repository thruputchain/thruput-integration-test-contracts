
[package]
name = "no_syscall_test"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[dependencies]
thruput-sdk = { workspace = true }
thruput-xdr = { workspace = true, features = ["xdrs", "syscalls"] }
thruput-syscall = { workspace = true }

[lib]
crate-type = ["rlib"]
doctest = false

[features]
entrypoints = []
dev = ["thruput-sdk/dev", "std"]
std = ["thruput-sdk/std"]
logging = ["thruput-sdk/logging"]

[dev-dependencies]
no_syscall_test = { path = ".", features = ["dev"] }


[[bin]]
name = "no_syscall_test"
path = "src/main.rs"
required-features = ["entrypoints"]
