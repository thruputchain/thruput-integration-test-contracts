cargo-features = ["trim-paths", "profile-rustflags"] #unstable

[package]
name = "sha256_wrapper"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["storage"] }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
default = ["guest"]
client = []
guest = []
mock = ["guest", "sdk/mock"]
logging = ["sdk/logging"]

[dev-dependencies]
sha256_wrapper = { path = ".", features = ["mock", "client"] }
sha2 = "0.10"
