[package]
name = "sha256_wrapper"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
thruput-sdk = { workspace = true, features = ["alloc"] }

# Optional
sha2 = { workspace = true, optional = true }

[lib]
crate-type = ["rlib"]
doctest = false

[features]
entrypoints = []
# `dep:sha2` for `checks`, which the rv32 integration test calls too, and
# so cannot take sha2 from the dev-dependencies.
dev = ["thruput-sdk/dev", "dep:sha2"]
logging = ["thruput-sdk/logging"]

[dev-dependencies]
sha256_wrapper = { path = ".", features = ["dev"] }
sha2 = { workspace = true }

[[bin]]
name = "sha256_wrapper"
path = "src/main.rs"
required-features = ["entrypoints"]
