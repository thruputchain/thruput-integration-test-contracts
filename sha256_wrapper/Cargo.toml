#cargo-features = ["trim-paths", "profile-rustflags"] #unstable

[package]
name = "sha256_wrapper"
version = "0.2.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["storage"] }
xdrs = { workspace = true, features = ["derive"] }

# Optional
bottle-test-if = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[[bin]]
name = "generate_spec_sha256_wrapper"
path = "src/bin/generate_spec.rs"
required-features = ["spec"]

[features]
dev = ["sdk/dev"]
bottle-test = ["dep:bottle-test-if", "dep:sha2"]
spec = ["sdk/spec"]
logging = ["sdk/logging"]

[dev-dependencies]
sha256_wrapper = { path = ".", features = ["dev"] }
sha2 = { workspace = true }
