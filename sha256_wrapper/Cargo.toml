#cargo-features = ["trim-paths", "profile-rustflags"] #unstable

[package]
name = "sha256_wrapper"
version = "0.2.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["storage"] }
xdrs = { workspace = true, features = ["derive"] }

# Optional
bottle-test-if = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
default = ["guest"]
client = []
guest = []
mock = ["guest", "sdk/mock"]
logging = ["sdk/logging"]
bottle-test = ["dep:bottle-test-if", "client", "dep:sha2"]

[dev-dependencies]
sha256_wrapper = { path = ".", features = ["mock", "client"] }
sha2 = { workspace = true }
