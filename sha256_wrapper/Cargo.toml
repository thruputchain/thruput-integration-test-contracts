#cargo-features = ["trim-paths", "profile-rustflags"] #unstable

[package]
name = "sha256_wrapper"
version = "0.2.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["alloc"] }

# Optional
bottle-test-if = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
entrypoints = []
dev = ["sdk/dev"]
bottle-test = ["dep:bottle-test-if", "dep:sha2"]
logging = ["sdk/logging"]

[dev-dependencies]
sha256_wrapper = { path = ".", features = ["dev"] }
sha2 = { workspace = true }

[[bin]]
name = "sha256_wrapper"
path = "src/main.rs"
required-features = ["entrypoints"]
