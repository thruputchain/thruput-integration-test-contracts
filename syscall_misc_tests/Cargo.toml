
[package]
name = "syscall_misc_tests"
version = "0.2.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["storage"] }
xdrs = { workspace = true, features = ["derive"] }
groundhog-xdr = { workspace = true, features = ["xdrs", "syscalls"] }

# Optional
sha2 = { workspace = true, optional = true }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[[bin]]
name = "generate_spec_syscall_misc_tests"
path = "src/bin/generate_spec.rs"
required-features = ["spec"]

[features]
dev = ["sdk/dev"]
spec = ["sdk/spec"]
logging = ["sdk/logging"]

[dev-dependencies]
syscall_misc_tests = { path = ".", features = ["dev"] }
sha2 = { workspace = true }
