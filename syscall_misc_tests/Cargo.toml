
[package]
name = "syscall_misc_tests"
version = "0.2.0"
edition = "2021"

[dependencies]
thruput-sdk = { workspace = true }
thruput-xdr = { workspace = true, features = ["xdrs", "syscalls"] }
thruput-syscall = { workspace = true }

# Optional
sha2 = { workspace = true, optional = true }

[lib]
crate-type = ["rlib"]
doctest = false

[features]
entrypoints = []
dev = ["thruput-sdk/dev"]
logging = ["thruput-sdk/logging"]

[dev-dependencies]
syscall_misc_tests = { path = ".", features = ["dev"] }
sha2 = { workspace = true }

[[bin]]
name = "syscall_misc_tests"
path = "src/main.rs"
required-features = ["entrypoints"]
