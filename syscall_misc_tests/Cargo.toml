
[package]
name = "syscall_misc_tests"
version = "0.2.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["storage"] }
groundhog-xdr = { workspace = true, features = ["xdrs", "syscalls"] }

# Optional
sha2 = { workspace = true, optional = true }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
entrypoints = []
dev = ["sdk/dev"]
logging = ["sdk/logging"]

[dev-dependencies]
syscall_misc_tests = { path = ".", features = ["dev"] }
sha2 = { workspace = true }

[[bin]]
name = "syscall_misc_tests"
path = "src/main.rs"
