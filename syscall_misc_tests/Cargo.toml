
[package]
name = "syscall_misc_tests"
version.workspace = true
edition = "2021"

[dependencies]
sdk = { workspace = true }
groundhog-xdr = { workspace = true, features = ["xdrs", "syscalls"] }
groundhog-syscall = { workspace = true }

# Optional
sha2 = { workspace = true, optional = true }

[lib]
crate-type = ["rlib"]
doctest = false

[features]
entrypoints = []
dev = ["sdk/dev"]
logging = ["sdk/logging"]

[dev-dependencies]
syscall_misc_tests = { path = ".", features = ["dev"] }
sha2 = { workspace = true }

[[bin]]
name = "syscall_misc_tests"
path = "src/main.rs"
required-features = ["entrypoints"]
