#cargo-features = ["trim-paths", "profile-rustflags"] #unstable

[package]
name = "fibonacci_raw"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[features]
default = ["guest"]
entrypoints = []
guest = []
mock = ["guest", "sdk/mock"]
logging = ["sdk/logging"]

[dev-dependencies]
fibonacci_raw = { path = ".", features = ["mock", "client"] }
