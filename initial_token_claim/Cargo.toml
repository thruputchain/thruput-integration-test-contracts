cargo-features = ["trim-paths", "profile-rustflags"] #unstable

[package]
name = "initial_token_claim"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["alloc"] }
serde = { workspace = true, features = ["derive"] }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
default = ["guest"]
client = []
guest = []
mock = ["guest", "sdk/mock"]

[dev-dependencies]
initial_token_claim = { path = ".", features = ["mock", "client"] }
