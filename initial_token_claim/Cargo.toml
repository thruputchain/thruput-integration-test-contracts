cargo-features = ["trim-paths", "profile-rustflags"] #unstable

[package]
name = "initial_token_claim"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["alloc"] }
xdrs = { workspace = true, optional = true, features = ["derive", "alloc", "extras", "int128_xdr"] }
groundhog-erc20-if = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[[bin]]
name = "generate_spec_initial_token_claim"
path = "src/bin/generate_spec.rs"
required-features = ["spec"]

[features]
default = ["guest"]
client = []
guest = []
mock = ["guest", "sdk/mock", "std"]
std = ["sdk/std"]
spec = ["std", "sdk/spec", "client", "dep:xdrs"]
logging = ["sdk/logging"]

[dev-dependencies]
initial_token_claim = { path = ".", features = ["mock", "client"] }
