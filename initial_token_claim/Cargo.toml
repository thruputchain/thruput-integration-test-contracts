#cargo-features = ["trim-paths", "profile-rustflags"] #unstable

[package]
name = "initial_token_claim"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["alloc"] }
groundhog-erc20-if = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[[bin]]
name = "generate_spec_initial_token_claim"
path = "src/bin/generate_spec.rs"
required-features = ["spec"]

[features]
client = []
dev = ["sdk/dev", "std"]
std = ["sdk/std"]
spec = ["std", "sdk/spec"]
logging = ["sdk/logging"]
alloc = []

[dev-dependencies]
initial_token_claim = { path = ".", features = ["dev"] }
