
[package]
name = "syscall_parse_hardening_test"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true }

[[bin]]
name = "generate_spec_syscall_parse_hardening_test"
path = "src/bin/generate_spec.rs"
required-features = ["spec"]

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
default = ["guest"]
client = []
guest = ["client"]
dev = ["guest", "sdk/dev", "std"]
spec = ["sdk/spec", "std", "client"]
std = ["sdk/std"]
logging = ["sdk/logging"]

[dev-dependencies]
syscall_parse_hardening_test = { path = ".", features = ["dev", "client"] }
