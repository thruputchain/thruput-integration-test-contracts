[package]
name = "manual_revert_caller"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
doctest = false
test = false

[[bin]]
name = "generate_spec_manual_revert_caller"
path = "src/bin/generate_spec.rs"
required-features = ["spec"]

[dependencies]
sdk = { workspace = true, features = ["storage"] }
manual_revert_test = { path = "../manual_revert_test" }

[dev-dependencies]
manual_revert_caller = { path = ".", features = ["dev"] }

[features]
client = []
guest = []
dev = ["sdk/dev", "manual_revert_test/dev"]
std = ["sdk/std", "manual_revert_test/std"]
spec = ["sdk/spec", "std"]
logging = ["sdk/logging", "manual_revert_test/logging"]
