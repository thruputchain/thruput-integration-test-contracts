[package]
name = "manual_revert_caller"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[lib]
crate-type = ["lib"]
doctest = false
test = false

[dependencies]
thruput-sdk = { workspace = true, features = ["alloc"] }
manual_revert_test = { path = "../manual_revert_test" }

[dev-dependencies]
manual_revert_caller = { path = ".", features = ["dev"] }

[features]
entrypoints = []
guest = []
dev = ["thruput-sdk/dev", "manual_revert_test/dev"]
std = ["thruput-sdk/std", "manual_revert_test/std"]
logging = ["thruput-sdk/logging", "manual_revert_test/logging"]

[[bin]]
name = "manual_revert_caller"
path = "src/main.rs"
required-features = ["entrypoints"]
