[package]
name = "manual_revert_caller"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
doctest = false
test = false

[[bin]]
name = "generate_spec_manual_revert_caller"
path = "src/bin/generate_spec.rs"
required-features = ["spec"]

[dependencies]
sdk = { workspace = true, features = ["storage", "logging"] }
manual_revert_test = { path = "../manual_revert_test", features = ["client"] }
xdrs = { workspace = true, features = ["derive", "alloc"] }

[dev-dependencies]
manual_revert_caller = { path = ".", features = ["mock", "client"] }

[features]
default = ["guest"]
client = []
guest = []
mock = ["guest", "sdk/mock", "manual_revert_test/mock"]
spec = ["sdk/spec", "std", "client"]
std = ["sdk/std", "manual_revert_test/std"]
logging = ["sdk/logging"]
