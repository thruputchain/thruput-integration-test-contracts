cargo-features = ["trim-paths", "profile-rustflags"] #unstable

[package]
name = "fibonacci_call"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["storage"] }
serde = { workspace = true, features = ["derive"] }
fibonacci = { path = "../fibonacci", features = ["client"] }
xdrs = { workspace = true, optional = true, features = ["derive", "alloc", "extras", "int128_xdr"] }


[[bin]]
name = "generate_spec"
path = "src/bin/generate_spec.rs"
required-features = ["spec"]

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
default = ["guest"]
client = []
guest = []
mock = ["guest", "sdk/mock", "fibonacci/mock"]
spec = ["sdk/spec", "std", "client", "dep:xdrs"]
std = ["sdk/std", "fibonacci/std"]

[dev-dependencies]
fibonacci_call = { path = ".", features = ["mock", "client"] }
