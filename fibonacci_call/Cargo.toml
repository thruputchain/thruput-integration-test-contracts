#cargo-features = ["trim-paths", "profile-rustflags"] #unstable

[package]
name = "fibonacci_call"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["alloc"] }
fibonacci = { path = "../fibonacci" }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[features]
entrypoints = []
dev = ["sdk/dev", "fibonacci/dev"]
std = ["sdk/std", "fibonacci/std"]
logging = ["sdk/logging"]

[dev-dependencies]
fibonacci_call = { path = ".", features = ["dev"] }

[[bin]]
name = "fibonacci_call"
path = "src/main.rs"
required-features = ["entrypoints"]
