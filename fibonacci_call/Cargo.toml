[package]
name = "fibonacci_call"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
thruput-sdk = { workspace = true }
fibonacci = { path = "../fibonacci" }

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[features]
entrypoints = []
dev = ["thruput-sdk/dev", "fibonacci/dev"]
std = ["thruput-sdk/std", "fibonacci/std"]
logging = ["thruput-sdk/logging"]

[dev-dependencies]
fibonacci_call = { path = ".", features = ["dev"] }

[[bin]]
name = "fibonacci_call"
path = "src/main.rs"
required-features = ["entrypoints"]
