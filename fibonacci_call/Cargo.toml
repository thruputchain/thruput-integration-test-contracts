#cargo-features = ["trim-paths", "profile-rustflags"] #unstable

[package]
name = "fibonacci_call"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["storage"] }
fibonacci = { path = "../fibonacci" }
xdrs = { workspace = true, features = ["derive", "alloc", "int128"] }

[[bin]]
name = "generate_spec_fibonacci_call"
path = "src/bin/generate_spec.rs"
required-features = ["spec"]

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[features]
dev = ["sdk/dev", "fibonacci/dev"]
spec = ["sdk/spec", "std"]
std = ["sdk/std", "fibonacci/std"]
logging = ["sdk/logging"]

[dev-dependencies]
fibonacci_call = { path = ".", features = ["dev"] }
