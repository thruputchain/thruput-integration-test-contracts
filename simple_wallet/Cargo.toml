
[package]
name = "simple_wallet"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["storage"] }
xdrs = { workspace = true, features = ["derive", "alloc"] }
groundhog-erc1271-if = { workspace = true }

[[bin]]
name = "generate_spec_simple_wallet"
path = "src/bin/generate_spec.rs"
required-features = ["spec"]

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[features]
dev = ["sdk/dev", "sdk/std", "groundhog-erc1271-if/dev"]
spec = ["sdk/spec", "std", "groundhog-erc1271-if/spec"]
std = ["sdk/std"]
logging = ["sdk/logging"]

[dev-dependencies]
simple_wallet = { path = ".", features = ["dev"] }
