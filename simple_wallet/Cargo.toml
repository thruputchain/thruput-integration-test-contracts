cargo-features = ["trim-paths", "profile-rustflags"] #unstable

[package]
name = "simple_wallet"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["storage", "single-threaded"] }
xdrs = { workspace = true, features = ["derive", "alloc", "extras"] }
groundhog-erc1271-if = { workspace = true }

[[bin]]
name = "generate_spec_simple_wallet"
path = "src/bin/generate_spec.rs"
required-features = ["spec"]

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[features]
default = ["guest"]
client = []
guest = []
mock = ["guest", "sdk/mock", "sdk/std", "groundhog-erc1271-if/mock"]
spec = ["sdk/spec", "std", "client", "groundhog-erc1271-if/spec"]
std = ["sdk/std", "groundhog-erc1271-if/std"]
logging = ["sdk/logging"]


[dev-dependencies]
simple_wallet = { path = ".", features = ["mock", "client"] }
