
[package]
name = "simple_wallet"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
thruput-sdk = { workspace = true, features = ["alloc"] }

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[features]
entrypoints = []
dev = ["thruput-sdk/dev", "thruput-sdk/std"]
std = ["thruput-sdk/std"]
logging = ["thruput-sdk/logging"]

[dev-dependencies]
simple_wallet = { path = ".", features = ["dev"] }

[[bin]]
name = "simple_wallet"
path = "src/main.rs"
required-features = ["entrypoints"]
