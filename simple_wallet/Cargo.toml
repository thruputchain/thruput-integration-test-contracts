
[package]
name = "simple_wallet"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["alloc"] }
groundhog-erc1271-if = { workspace = true }

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[features]
entrypoints = []
dev = ["sdk/dev", "sdk/std", "groundhog-erc1271-if/dev"]
std = ["sdk/std"]
logging = ["sdk/logging"]

[dev-dependencies]
simple_wallet = { path = ".", features = ["dev"] }

[[bin]]
name = "simple_wallet"
path = "src/main.rs"
required-features = ["entrypoints"]
