cargo-features = ["trim-paths", "profile-rustflags"] #unstable

[package]
name = "simple_wallet"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["storage"] }
serde = { workspace = true, features = ["derive"] }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
default = ["guest"]
client = []
guest = []
mock = ["guest", "sdk/mock"]

[dev-dependencies]
simple_wallet = { path = ".", features = ["mock", "client"] }
