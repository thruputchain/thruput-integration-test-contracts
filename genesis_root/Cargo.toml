[package]
name = "genesis_root"
version = "0.1.0"
edition = "2021"

[dependencies]
thruput-sdk = { workspace = true, features = ["alloc"] }
thruput-erc20-if = { workspace = true }

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[features]
entrypoints = []
dev = ["thruput-sdk/dev", "std"]
std = ["thruput-sdk/std"]
logging = ["thruput-sdk/logging"]
alloc = []

[dev-dependencies]
genesis_root = { path = ".", features = ["dev"] }

[[bin]]
name = "genesis_root"
path = "src/main.rs"
required-features = ["entrypoints"]
