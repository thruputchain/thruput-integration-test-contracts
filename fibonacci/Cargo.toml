cargo-features = ["trim-paths", "profile-rustflags"] #unstable

[package]
name = "fibonacci"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["storage"] }
xdrs = { workspace = true, features = ["derive", "alloc", "extras", "int128_xdr"] }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[[bin]]
name = "generate_spec"
path = "src/bin/generate_spec.rs"
required-features = ["spec"]

[features]
default = ["guest"]
client = []
guest = []
mock = ["guest", "sdk/mock"]
spec = ["sdk/spec", "std", "client"]
std = ["sdk/std"]

[dev-dependencies]
fibonacci = { path = ".", features = ["mock", "client"] }
