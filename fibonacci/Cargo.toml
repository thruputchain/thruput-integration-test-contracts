#cargo-features = ["trim-paths", "profile-rustflags"] #unstable

[package]
name = "fibonacci"
version = "0.2.0"
edition = "2021"

[dependencies]
thruput-sdk = { workspace = true }

# Optional
bottle-test-if = { workspace = true, optional = true }

[lib]
crate-type = ["rlib"]
doctest = false

[[bin]]
name = "fibonacci"
path = "src/main.rs"
required-features = ["entrypoints"]

[features]
entrypoints = []
dev = ["thruput-sdk/dev"]
std = ["thruput-sdk/std"]
logging = ["thruput-sdk/logging", "thruput-sdk/alloc"]
bottle-test = ["dep:bottle-test-if"]
alloc = []

[dev-dependencies]
fibonacci = { path = ".", features = ["dev"] }
