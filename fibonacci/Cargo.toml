[package]
name = "fibonacci"
version = "0.2.0"
edition = "2021"
license.workspace = true
publish = false

[dependencies]
thruput-sdk = { workspace = true }

[lib]
crate-type = ["rlib"]
doctest = false

[[bin]]
name = "fibonacci"
path = "src/main.rs"
required-features = ["entrypoints"]

[features]
entrypoints = []
dev = ["thruput-sdk/dev"]
std = ["thruput-sdk/std"]
logging = ["thruput-sdk/logging", "thruput-sdk/alloc"]
alloc = []

[dev-dependencies]
fibonacci = { path = ".", features = ["dev"] }
