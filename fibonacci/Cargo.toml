#cargo-features = ["trim-paths", "profile-rustflags"] #unstable

[package]
name = "fibonacci"
version = "0.2.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["storage"] }

# Optional
bottle-test-if = { workspace = true, optional = true }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[[bin]]
name = "generate_spec_fibonacci"
path = "src/bin/generate_spec.rs"
required-features = ["spec"]

[features]
client = []
dev = ["sdk/dev"]
spec = ["sdk/spec", "std", "sdk/alloc"]
std = ["sdk/std"]
logging = ["sdk/logging", "sdk/alloc", "alloc"]
bottle-test = ["dep:bottle-test-if"]
alloc = []

[dev-dependencies]
fibonacci = { path = ".", features = ["dev"] }
