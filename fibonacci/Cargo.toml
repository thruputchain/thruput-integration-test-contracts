[package]
name = "fibonacci"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["storage"] }
serde = { workspace = true, features = ["derive"] }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
client = []
guest = []
alloc = ["sdk/alloc"]
std = ["alloc", "sdk/std"]
mock = ["guest", "std", "sdk/mock"]

[dev-dependencies]
fibonacci = { path = ".", features = ["mock", "client"] }