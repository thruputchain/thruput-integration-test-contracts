#cargo-features = ["trim-paths", "profile-rustflags"] #unstable

[package]
name = "fibonacci"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["storage"] }
xdrs = { workspace = true, features = ["derive", "alloc", "int128"] }

# Optional
bottle-test-if = { workspace = true, optional = true }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[[bin]]
name = "generate_spec_fibonacci"
path = "src/bin/generate_spec.rs"
required-features = ["spec"]

[features]
default = ["guest"]
client = []
guest = []
mock = ["guest", "sdk/mock"]
spec = ["sdk/spec", "std", "client", "sdk/alloc"]
std = ["sdk/std"]
logging = ["sdk/logging", "sdk/alloc", "alloc"]
bottle-test = ["dep:bottle-test-if", "client"]
alloc = []

[dev-dependencies]
fibonacci = { path = ".", features = ["mock", "client"] }
