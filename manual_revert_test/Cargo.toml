[package]
name = "manual_revert_test"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
doctest = false
test = false

[dependencies]
sdk = { workspace = true , features = ["storage", "logging"] }
thiserror = { version = "2.0.10", default-features = false }
xdrs = { workspace = true }

[[bin]]
name = "generate_spec_manual_revert_test"
path = "src/bin/generate_spec.rs"
required-features = ["spec"]

[features]
default = ["guest", "alloc", "xdrs"]
client = []
guest = []
mock = ["guest", "sdk/mock"]
alloc = []
xdrs = []
spec = ["sdk/spec", "std", "client"]
std = ["sdk/std"]
logging = ["sdk/logging"]

[dev-dependencies]
manual_revert_test = { path = ".", features = ["mock", "client"] }
