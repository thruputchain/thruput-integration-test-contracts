[package]
name = "manual_revert_test"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
sdk = { workspace = true }

[features]
default = ["guest", "alloc", "xdrs"]
client = []
guest = []
mock = ["guest", "sdk/mock"]
alloc = []
xdrs = []

[dev-dependencies]
manual_revert_test = { path = ".", features = ["mock", "client"] }
