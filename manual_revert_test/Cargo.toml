[package]
name = "manual_revert_test"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
doctest = false
test = false

[dependencies]
sdk = { workspace = true , features = ["logging"] }
thiserror = { version = "2.0.10", default-features = false }
groundhog-xdr = { workspace = true }

[features]
default = ["guest", "alloc", "xdrs"]
entrypoints = []
guest = []
mock = ["guest", "sdk/mock"]
alloc = []
xdrs = []
dev = ["sdk/dev", "std"]
std = ["sdk/std"]
logging = ["sdk/logging"]

[dev-dependencies]
manual_revert_test = { path = ".", features = ["mock"] }

[[bin]]
name = "manual_revert_test"
path = "src/main.rs"
required-features = ["entrypoints"]
