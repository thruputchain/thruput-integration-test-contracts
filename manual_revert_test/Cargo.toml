[package]
name = "manual_revert_test"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["lib"]
doctest = false
test = false

[dependencies]
thruput-sdk = { workspace = true, features = ["logging"] }
thiserror = { version = "2.0.10", default-features = false }
thruput-xdr = { workspace = true }

[features]
default = ["guest", "xdrs"]
entrypoints = []
guest = []
alloc = []
xdrs = []
dev = ["guest", "thruput-sdk/dev", "std"]
std = ["thruput-sdk/std"]
logging = ["thruput-sdk/logging"]

[dev-dependencies]
manual_revert_test = { path = ".", features = ["dev"] }

[[bin]]
name = "manual_revert_test"
path = "src/main.rs"
required-features = ["entrypoints"]
