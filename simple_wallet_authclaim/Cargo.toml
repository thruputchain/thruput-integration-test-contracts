
[package]
name = "simple_wallet_authclaim"
version = "0.1.0"
edition = "2021"

[dependencies]
thruput-sdk = { workspace = true }

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[features]
entrypoints = []
dev = [ "thruput-sdk/dev", "thruput-sdk/std"]
std = ["thruput-sdk/std"]
logging = ["thruput-sdk/logging"]

[dev-dependencies]
simple_wallet_authclaim = { path = ".", features = ["dev"] }

[[bin]]
name = "simple_wallet_authclaim"
path = "src/main.rs"
required-features = ["entrypoints"]
