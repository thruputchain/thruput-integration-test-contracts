
[package]
name = "simple_wallet_authclaim"
version.workspace = true
edition = "2021"

[dependencies]
sdk = { workspace = true }

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[features]
entrypoints = []
dev = [ "sdk/dev", "sdk/std"]
std = ["sdk/std"]
logging = ["sdk/logging"]

[dev-dependencies]
simple_wallet_authclaim = { path = ".", features = ["dev"] }

[[bin]]
name = "simple_wallet_authclaim"
path = "src/main.rs"
required-features = ["entrypoints"]
