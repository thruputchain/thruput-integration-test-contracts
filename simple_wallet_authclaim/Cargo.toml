
[package]
name = "simple_wallet_authclaim"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true }

[[bin]]
name = "generate_spec_simple_wallet_authclaim"
path = "src/bin/generate_spec.rs"
required-features = ["spec"]

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[features]
entrypoints = []
dev = [ "sdk/dev", "sdk/std"]
spec = ["sdk/spec", "std"]
std = ["sdk/std"]
logging = ["sdk/logging"]

[dev-dependencies]
simple_wallet_authclaim = { path = ".", features = ["dev", "entrypoints"] }
