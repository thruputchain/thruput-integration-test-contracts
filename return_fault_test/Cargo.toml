
[package]
name = "return_fault_test"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
entrypoints = []
dev = ["sdk/dev", "std"]
std = ["sdk/std"]
logging = ["sdk/logging"]

[dev-dependencies]
return_fault_test = { path = ".", features = ["dev"] }

[[bin]]
name = "return_fault_test"
path = "src/main.rs"
required-features = ["entrypoints"]
