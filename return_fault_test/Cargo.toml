
[package]
name = "return_fault_test"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true }

[[bin]]
name = "generate_spec_return_fault_test"
path = "src/bin/generate_spec.rs"
required-features = ["spec"]

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
client = []
dev = ["sdk/dev", "std"]
spec = ["sdk/spec", "std"]
std = ["sdk/std"]
logging = ["sdk/logging"]

[dev-dependencies]
return_fault_test = { path = ".", features = ["dev"] }
