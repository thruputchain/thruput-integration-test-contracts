[package]
name = "payment_channel"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
thruput-sdk = { workspace = true, features = ["alloc"] }
thruput-erc20-if = { workspace = true }

[lib]
crate-type = ["rlib"]
doctest = false

[features]
entrypoints = []
dev = ["thruput-sdk/dev", "std"]
std = ["thruput-sdk/std"]
logging = ["thruput-sdk/logging"]

[dev-dependencies]
payment_channel = { path = ".", features = ["dev"] }

[[bin]]
name = "payment_channel"
path = "src/main.rs"
required-features = ["entrypoints"]
