[package]
name = "payment_channel"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true , features = ["storage"] }
groundhog-erc20-if = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
entrypoints = []
dev = ["sdk/dev", "std"]
std = ["sdk/std"]
logging = ["sdk/logging"]

[dev-dependencies]
payment_channel = { path = ".", features = ["dev"] }
