[package]
name = "payment_channel"
version.workspace = true
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["alloc"] }
groundhog-erc20-if = { workspace = true }

[lib]
crate-type = ["rlib"]
doctest = false

[features]
entrypoints = []
dev = ["sdk/dev", "std"]
std = ["sdk/std"]
logging = ["sdk/logging"]

[dev-dependencies]
payment_channel = { path = ".", features = ["dev"] }

[[bin]]
name = "payment_channel"
path = "src/main.rs"
required-features = ["entrypoints"]
