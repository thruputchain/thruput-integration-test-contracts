[package]
name = "htlc"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[dependencies]
thruput-sdk = { workspace = true }
thruput-erc20-if = { workspace = true }

[lib]
crate-type = ["rlib"]
doctest = false

[features]
entrypoints = []
dev = ["thruput-sdk/dev", "std"]
std = ["thruput-sdk/std"]
logging = ["thruput-sdk/logging"]

[dev-dependencies]
htlc = { path = ".", features = ["dev"] }


[[bin]]
name = "htlc"
path = "src/main.rs"
required-features = ["entrypoints"]
