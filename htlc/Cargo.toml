#cargo-features = ["trim-paths", "profile-rustflags"] #unstable

[package]
name = "htlc"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true , features = ["storage"] }
groundhog-erc20-if = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
entrypoints = []
dev = ["sdk/dev", "std"]
std = ["sdk/std"]
logging = ["sdk/logging"]

[dev-dependencies]
htlc = { path = ".", features = ["dev"] }


[[bin]]
name = "htlc"
path = "src/main.rs"
required-features = ["entrypoints"]
