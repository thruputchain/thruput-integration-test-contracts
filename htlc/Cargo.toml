#cargo-features = ["trim-paths", "profile-rustflags"] #unstable

[package]
name = "htlc"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true , features = ["storage"] }
xdrs = { workspace = true, features = ["derive", "int128"] }
groundhog-erc20-if = { workspace = true }

[[bin]]
name = "generate_spec_htlc"
path = "src/bin/generate_spec.rs"
required-features = ["spec"]

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
dev = ["sdk/dev", "std"]
spec = ["sdk/spec", "std"]
std = ["sdk/std"]
logging = ["sdk/logging"]

[dev-dependencies]
htlc = { path = ".", features = ["dev"] }

