[package]
name = "nocontract_wallet"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[lib]
crate-type = ["lib"]
doctest = false
test = false

[dependencies]
thruput-sdk = { workspace = true }

[features]
default = []
entrypoints = []
dev = ["thruput-sdk/dev"]
guest = []
std = ["thruput-sdk/std"]
logging = ["thruput-sdk/logging", "std"]

# An interface and client library, deliberately not a guest contract: built
# as one, its artifact had no entrypoints and could not be invoked. Tests use
# its host build and Client.
[package.metadata.gnaw]
kind = "library"
