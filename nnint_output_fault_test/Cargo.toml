
[package]
name = "nnint_output_fault_test"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true }
groundhog-xdr = { workspace = true, features = ["xdrs", "syscalls"] }
groundhog-syscall = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
entrypoints = []
dev = ["sdk/dev"]
mock = ["sdk/mock", "std"]
std = ["sdk/std"]
logging = ["sdk/logging"]

[dev-dependencies]
nnint_output_fault_test = { path = ".", features = ["mock"] }

[[bin]]
name = "nnint_output_fault_test"
path = "src/main.rs"
required-features = ["entrypoints"]
