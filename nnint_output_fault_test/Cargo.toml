
[package]
name = "nnint_output_fault_test"
version.workspace = true
edition = "2021"

[dependencies]
sdk = { workspace = true }
groundhog-xdr = { workspace = true, features = ["xdrs", "syscalls"] }
groundhog-syscall = { workspace = true }

[lib]
crate-type = ["rlib"]
doctest = false

[features]
entrypoints = []
dev = ["sdk/dev", "std"]
std = ["sdk/std"]
logging = ["sdk/logging"]

[dev-dependencies]
nnint_output_fault_test = { path = ".", features = ["dev"] }

[[bin]]
name = "nnint_output_fault_test"
path = "src/main.rs"
required-features = ["entrypoints"]
