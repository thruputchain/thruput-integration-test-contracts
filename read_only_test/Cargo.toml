[package]
name = "read_only_test"
version = "0.2.0"
edition = "2021"

[dependencies]
thruput-sdk = { workspace = true, features = ["alloc"] }
thruput-xdr = { workspace = true, features = ["xdrs"]}
thruput-syscall = { workspace = true }
thruput-erc20-if = { workspace = true }

[lib]
crate-type = ["rlib"]
doctest = false

[features]
entrypoints = []
dev = ["thruput-sdk/dev", "std"]
std = ["thruput-sdk/std"]
logging = ["thruput-sdk/logging"]

[dev-dependencies]
read_only_test = { path = ".", features = ["dev"] }

[[bin]]
name = "read_only_test"
path = "src/main.rs"
required-features = ["entrypoints"]
