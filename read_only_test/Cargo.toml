cargo-features = ["trim-paths", "profile-rustflags"] #unstable

[package]
name = "read_only_test"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true }
groundhog_xdr = { workspace = true, features = ["xdrs"]}
xdrs = { workspace = true, features = ["alloc", "xdr_common"] }

[[bin]]
name = "generate_spec"
path = "src/bin/generate_spec.rs"
required-features = ["spec"]

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
default = ["guest", "alloc", "xdrs"]
client = []
guest = []
mock = ["guest", "sdk/mock"]
alloc = []
xdrs = []
spec = ["sdk/spec", "std", "client"]
std = ["sdk/std"]

[dev-dependencies]
read_only_test = { path = ".", features = ["mock", "client"] }
