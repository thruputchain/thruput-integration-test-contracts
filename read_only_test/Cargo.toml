[package]
name = "read_only_test"
version = "0.2.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["storage"] }
groundhog-xdr = { workspace = true, features = ["xdrs"]}

# Optional
bottle-test-if = { workspace = true, optional = true }

[[bin]]
name = "generate_spec_read_only_test"
path = "src/bin/generate_spec.rs"
required-features = ["spec"]

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
dev = ["sdk/dev"]
spec = ["sdk/spec", "std"]
std = ["sdk/std"]
logging = ["sdk/logging"]
bottle-test = ["dep:bottle-test-if"]

[dev-dependencies]
read_only_test = { path = ".", features = ["dev"] }
