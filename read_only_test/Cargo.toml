[package]
name = "read_only_test"
version = "0.2.0"
edition = "2021"

[dependencies]
sdk = { workspace = true }
groundhog-xdr = { workspace = true, features = ["xdrs"]}
groundhog-syscall = { workspace = true }
groundhog-erc20-if = { workspace = true }

# Optional
bottle-test-if = { workspace = true, optional = true }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
entrypoints = []
dev = ["sdk/dev"]
std = ["sdk/std"]
logging = ["sdk/logging"]
bottle-test = ["dep:bottle-test-if"]

[dev-dependencies]
read_only_test = { path = ".", features = ["dev", "std"] }

[[bin]]
name = "read_only_test"
path = "src/main.rs"
required-features = ["entrypoints"]
