cargo-features = ["trim-paths", "profile-rustflags"] #unstable

[workspace]
members = [
    "fibonacci",
]
resolver = "2"

[workspace.dependencies]
sdk = { package = "sdk_rs", git = "ssh://git@github.com/groundhogchain/sdk_rs.git", submodules = true }
serde = { version = "1.0.217", default-features = false }

[profile.dev]
opt-level = "z"
overflow-checks = false
debug = false
strip = "debuginfo"
panic = "abort"

[profile.release]
opt-level = 3
overflow-checks = false
debug = false
strip = "symbols"
debug-assertions = false
panic = "abort"
lto = true
codegen-units = 1
trim-paths = "all" # unstable
#rustflags = [ "-C", "link-args=-zstack-size=64000" ]