
[package]
name = "tuple_return"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["storage"] }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[[bin]]
name = "generate_spec_tuple_return"
path = "src/bin/generate_spec.rs"
required-features = ["spec"]

[features]
default = ["guest"]
entrypoints = []
guest = ["sdk/alloc"]
dev = ["guest", "sdk/dev"]
spec = ["sdk/spec", "std", "sdk/alloc"]
std = ["sdk/std"]
logging = ["sdk/logging", "sdk/alloc"]

[dev-dependencies]
tuple_return = { path = ".", features = ["dev", "entrypoints"] }
