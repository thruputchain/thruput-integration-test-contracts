
[package]
name = "tuple_return"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
thruput-sdk = { workspace = true, features = ["alloc"] }

[lib]
crate-type = ["rlib"]
doctest = false

[features]
default = []
entrypoints = []
dev = ["thruput-sdk/dev"]
std = ["thruput-sdk/std"]
logging = ["thruput-sdk/logging", "thruput-sdk/alloc"]

[dev-dependencies]
tuple_return = { path = ".", features = ["dev"] }

[[bin]]
name = "tuple_return"
path = "src/main.rs"
required-features = ["entrypoints"]
