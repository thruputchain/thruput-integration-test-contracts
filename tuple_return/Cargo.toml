
[package]
name = "tuple_return"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["storage", "alloc"] }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
default = []
entrypoints = []
dev = ["sdk/dev"]
std = ["sdk/std"]
logging = ["sdk/logging", "sdk/alloc"]

[dev-dependencies]
tuple_return = { path = ".", features = ["dev", "entrypoints"] }
