[package]
name = "calldata_raw"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
publish = false

[dependencies]
thruput-sdk = { workspace = true, features = ["alloc"] }

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[[bin]]
name = "calldata_raw"
path = "src/main.rs"
required-features = ["entrypoints"]

[features]
entrypoints = []
dev = ["thruput-sdk/dev"]

[dev-dependencies]
calldata_raw = { path = ".", features = ["dev"] }
