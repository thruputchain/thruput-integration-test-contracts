
[package]
name = "txs_roundtrip"
version.workspace = true
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["alloc"] }
xdrs = { workspace = true, features = ["derive", "alloc", "int128"] }

[lib]
crate-type = ["rlib"]
doctest = false

[features]
entrypoints = []
default = ["xdrs"]
xdrs = []
dev = ["sdk/dev"]
std = ["sdk/std"]
logging = ["sdk/logging"]

[dev-dependencies]
txs_roundtrip = { path = ".", features = ["dev"] }

[[bin]]
name = "txs_roundtrip"
path = "src/main.rs"
required-features = ["entrypoints"]
