
[package]
name = "txs_roundtrip"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true, features = ["storage"] }
xdrs = { workspace = true, features = ["derive", "alloc", "int128"] }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
entrypoints = []
default = ["xdrs"]
xdrs = []
dev = ["sdk/dev"]
std = ["sdk/std"]
logging = ["sdk/logging"]

[dev-dependencies]
txs_roundtrip = { path = ".", features = ["dev"] }
