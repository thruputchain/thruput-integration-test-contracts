
[package]
name = "txs_roundtrip"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[dependencies]
thruput-sdk = { workspace = true, features = ["alloc"] }
xdrs = { workspace = true, features = ["derive", "alloc", "int128"] }

[lib]
crate-type = ["rlib"]
doctest = false

[features]
entrypoints = []
default = ["xdrs"]
xdrs = []
dev = ["thruput-sdk/dev"]
std = ["thruput-sdk/std"]
logging = ["thruput-sdk/logging"]

[dev-dependencies]
txs_roundtrip = { path = ".", features = ["dev"] }

[[bin]]
name = "txs_roundtrip"
path = "src/main.rs"
required-features = ["entrypoints"]
