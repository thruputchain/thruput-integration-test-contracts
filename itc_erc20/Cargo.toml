[package]
name = "itc_erc20"
description = "ERC20 contract"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[dependencies]
sdk = { workspace = true }
groundhog-erc20-if = { workspace = true }

# Optional testing dependencies
erc20-native-test = { workspace = true, optional = true, features = ["no_check_aborts"] }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
entrypoints = []
dev = ["std", "sdk/dev", "groundhog-erc20-if/dev", "dep:erc20-native-test"]
std = ["sdk/std"]
logging = ["sdk/logging", "sdk/alloc", "alloc"]
alloc = []

# Use checked nnint operations to fail before commit.  With this enabled,
# the "no_check_aborts" test feature may be omitted.
checked = []

[dev-dependencies]
itc_erc20 = { path = ".", features = ["dev"] }

[[bin]]
name = "itc_erc20"
path = "src/main.rs"
required-features = ["entrypoints"]
