[package]
name = "itc_erc20"
version = "0.1.1"
edition = "2024"

[dependencies]
sdk = { workspace = true }
serde = { workspace = true }
groundhog-erc20-if = { workspace = true }
thiserror = { workspace = true }
xdrs = { workspace = true, features = ["derive"] }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
guest = []
mock = ["guest", "sdk/mock", "groundhog-erc20-if/mock"]
logging = ["sdk/logging"]

[dev-dependencies]
itc_erc20 = { path = ".", features = ["mock"] }
