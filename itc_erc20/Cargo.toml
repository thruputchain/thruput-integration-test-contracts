[package]
name = "itc_erc20"
version = "0.1.1"
edition = "2024"

[dependencies]
sdk = { workspace = true }
groundhog-erc20-if = { workspace = true }
xdrs = { workspace = true, features = ["derive"] }

# Optional testing dependencies
erc20-bottle-test = { workspace = true, optional = true }

[[bin]]
name = "generate_spec_itc_erc20"
path = "src/bin/generate_spec.rs"
required-features = ["spec"]

[[bin]]
name = "generate_types_itc_erc20"
path = "src/bin/generate_types.rs"
required-features = ["spec"]

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
guest = []
mock = ["guest", "std", "sdk/mock", "groundhog-erc20-if/mock"]
spec = ["sdk/spec", "std", "groundhog-erc20-if/spec", "sdk/alloc"]
std = ["sdk/std", "groundhog-erc20-if/std"]
logging = ["sdk/logging", "sdk/alloc", "alloc"]
bottle-test = ["dep:erc20-bottle-test"]
alloc = []

[dev-dependencies]
itc_erc20 = { path = ".", features = ["mock"] }
