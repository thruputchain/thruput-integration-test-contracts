[package]
name = "itc_erc20"
version = "0.1.1"
edition = "2024"

[dependencies]
sdk = { workspace = true }
groundhog-erc20-if = { workspace = true }
xdrs = { workspace = true, features = ["derive"] }

[[bin]]
name = "generate_spec"
path = "src/bin/generate_spec.rs"
required-features = ["spec"]

[[bin]]
name = "generate_types"
path = "src/bin/generate_types.rs"
required-features = ["spec"]

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
default = ["guest"]
guest = []
mock = ["guest", "std", "sdk/mock", "groundhog-erc20-if/mock"]
spec = ["sdk/spec", "std", "groundhog-erc20-if/spec"]
std = ["sdk/std", "groundhog-erc20-if/std"]
logging = ["sdk/logging"]


[dev-dependencies]
itc_erc20 = { path = ".", features = ["mock"] }
